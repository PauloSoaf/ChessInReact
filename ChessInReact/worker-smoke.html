<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chromium Web Worker Smoke Test</title>
</head>
<body>
  <div id="result">RUNNING</div>
  <div id="react-root" style="opacity: 0.01; pointer-events: auto;"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      var errStr = 'ERROR: uncaught ' + msg + ' at ' + url + ':' + line + ':' + col;
      document.getElementById('result').textContent = errStr;
      fetch('/__smoke_result', { method: 'POST', body: errStr }).catch(function(){});
    };
    window.onunhandledrejection = function(e) {
      var errStr = 'ERROR: unhandled rejection: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e);
      document.getElementById('result').textContent = errStr;
      fetch('/__smoke_result', { method: 'POST', body: errStr }).catch(function(){});
    };
  </script>
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import App from './src/App.tsx';
    import { gameStore } from './src/core/state/gameStore.ts';
    import { EngineBridge } from './src/core/workers/EngineBridge.ts';
    import { createDefaultDomainState } from './src/core/state/initialState.ts';
    import { asCoordinateKey, asEntityId } from './src/core/coordinates/index.ts';

    async function runTest() {
      const resultEl = document.getElementById('result');
      try {
        // Instantiate EngineBridge with native browser Worker (no workerPort override!)
        const bridge = new EngineBridge({ timeoutMs: 5000 });

        // 1. Protocol PING / PONG handshake
        const pong = await bridge.ping();
        if (pong !== 'PONG') throw new Error(`PING failed: got ${pong}`);

        // 2. Transfer ArrayBuffer & state metadata
        const domain = createDefaultDomainState('browser-worker-smoke');
        domain.boardEntities[asEntityId('p1')] = {
          id: asEntityId('p1'),
          type: 'PIECE',
          ownerId: 'P1',
          variantId: 'PAWN',
          position: asCoordinateKey('4,1'),
          hasMoved: false,
          isCaptured: false,
        };
        const meta = await bridge.echoStateMetadata(domain);
        if (meta.schemaVersion < 1 || meta.entityCount !== 1) {
          throw new Error(`Metadata mismatch: ${JSON.stringify(meta)}`);
        }

        // 3. Transfer & deserialize entities
        const echoed = await bridge.echoDeserializedEntities(domain);
        if (echoed.entities.length !== 1 || echoed.entities[0].id !== 'p1') {
          throw new Error(`Entity echo mismatch: ${JSON.stringify(echoed)}`);
        }

        // 4. Real procedural generation request (chunk 16x16 with 256 cells)
        const chunks = await bridge.generateChunks({
          topologyType: 'SQUARE',
          seed: 'browser-smoke-seed',
          chunkCoords: [{ chunkX: 0, chunkY: 0 }],
          chunkSize: 16,
        });
        if (!chunks || chunks.length !== 1) {
          throw new Error(`GENERATE_CHUNKS failed: expected 1 chunk, got ${chunks?.length}`);
        }
        const cellCount = Object.keys(chunks[0].cells).length;
        if (cellCount !== 256) {
          throw new Error(`GENERATE_CHUNKS cell count mismatch: expected 256, got ${cellCount}`);
        }

        // 5. Real A* pathfinding computation in worker thread
        const pathResult = await bridge.computePath({
          topologyType: 'SQUARE',
          start: asCoordinateKey('0,0'),
          goal: asCoordinateKey('3,3'),
          obstacleCoords: [asCoordinateKey('1,1'), asCoordinateKey('2,2')],
        });
        if (!pathResult.found || pathResult.path.length === 0) {
          throw new Error(`COMPUTE_PATHFINDING failed to find path around obstacles`);
        }

        // 6. Voronoi irregular chunk generation & pathfinding in worker thread (PATCH-13)
        const voronoiChunks = await bridge.generateChunks({
          topologyType: 'VORONOI_IRREGULAR',
          seed: 'voronoi-worker-smoke-seed',
          chunkCoords: [{ chunkX: 0, chunkY: 0 }],
          chunkSize: 16,
          topologyOptions: { boundingRadius: 32 },
        });
        if (!voronoiChunks || voronoiChunks.length !== 1) {
          throw new Error(`VORONOI GENERATE_CHUNKS failed: expected 1 chunk`);
        }
        const voronoiCell = voronoiChunks[0].cells['0,0'];
        if (!voronoiCell || voronoiCell.topology !== 'VORONOI_IRREGULAR') {
          throw new Error(`VORONOI GENERATE_CHUNKS cell topology mismatch: expected VORONOI_IRREGULAR, got ${voronoiCell?.topology}`);
        }

        const voronoiSeed = 'voronoi-worker-smoke-seed';
        const voronoiPath = await bridge.computePath({
          topologyType: 'VORONOI_IRREGULAR',
          seed: voronoiSeed,
          start: asCoordinateKey('0,0'),
          goal: asCoordinateKey('1,1'),
          topologyOptions: { boundingRadius: 32 },
        });
        if (!voronoiPath.found) {
          throw new Error(`VORONOI COMPUTE_PATHFINDING failed to find path in Voronoi topology`);
        }

        // Seed contract: Voronoi pathfinding without an explicit seed must be rejected (no default-seed fallback)
        let seedlessRejected = false;
        try {
          await bridge.computePath({
            topologyType: 'VORONOI_IRREGULAR',
            start: asCoordinateKey('0,0'),
            goal: asCoordinateKey('1,1'),
            topologyOptions: { boundingRadius: 32 },
          });
        } catch (e) {
          seedlessRejected = /explicit seed/i.test(String(e && e.message));
        }
        if (!seedlessRejected) {
          throw new Error('VORONOI COMPUTE_PATHFINDING without explicit seed was not rejected');
        }

        // 7. Spec 05 Real AI Best Move calculation in native Worker
        const aiDomain = createDefaultDomainState('ai-smoke-match');
        aiDomain.boardEntities[asEntityId('w_k')] = {
          id: asEntityId('w_k'),
          type: 'PIECE',
          ownerId: 'P1',
          variantId: 'KING',
          position: asCoordinateKey('4,0'),
          hasMoved: false,
          isCaptured: false,
        };
        aiDomain.boardEntities[asEntityId('b_k')] = {
          id: asEntityId('b_k'),
          type: 'PIECE',
          ownerId: 'P2',
          variantId: 'KING',
          position: asCoordinateKey('4,7'),
          hasMoved: false,
          isCaptured: false,
        };
        aiDomain.boardEntities[asEntityId('b_r')] = {
          id: asEntityId('b_r'),
          type: 'PIECE',
          ownerId: 'P2',
          variantId: 'ROOK',
          position: asCoordinateKey('0,7'),
          hasMoved: false,
          isCaptured: false,
        };
        aiDomain.occupancy[asCoordinateKey('4,0')] = asEntityId('w_k');
        aiDomain.occupancy[asCoordinateKey('4,7')] = asEntityId('b_k');
        aiDomain.occupancy[asCoordinateKey('0,7')] = asEntityId('b_r');
        aiDomain.activePlayer = 'P2';
        aiDomain.turnState.activePlayer = 'P2';

        const aiResult = await bridge.calculateBestMove(aiDomain, {
          difficulty: 1,
          timeBudgetMs: 500,
          depthLimit: 2,
        });

        if (!aiResult || !aiResult.bestMove) {
          throw new Error('CALCULATE_BEST_MOVE failed to return a valid bestMove in worker');
        }

        const chosenPiece = aiDomain.boardEntities[aiResult.bestMove.pieceId];
        if (!chosenPiece || chosenPiece.ownerId !== 'P2') {
          throw new Error(`AI BestMove must belong to active player P2, got pieceId=${aiResult.bestMove.pieceId}, owner=${chosenPiece?.ownerId}`);
        }

        // Verify the original aiDomain state was not mutated by worker search
        if (aiDomain.activePlayer !== 'P2' || aiDomain.boardEntities[asEntityId('b_k')].position !== '4,7') {
          throw new Error('CALCULATE_BEST_MOVE illegally mutated original domain state');
        }

        // 8. Clean isolated worker termination
        bridge.dispose();

        // 9. Full React.StrictMode Human vs Native Bot Match Integration in real browser
        const reactContainer = document.getElementById('react-root');
        const reactRoot = ReactDOM.createRoot(reactContainer);
        reactRoot.render(React.createElement(React.StrictMode, null, React.createElement(App)));

        // Wait for React to complete mount
        await new Promise((r) => setTimeout(r, 500));

        const botCheckbox = document.getElementById('bot-toggle-checkbox');
        if (!botCheckbox) throw new Error('React tree did not render bot-toggle-checkbox');
        botCheckbox.click();
        await new Promise((r) => setTimeout(r, 200));

        // White moves e2 -> e4 (4,1 -> 4,3)
        const sqE2 = document.querySelector('[data-testid="square-4,1"]');
        const sqE4 = document.querySelector('[data-testid="square-4,3"]');
        if (!sqE2 || !sqE4) throw new Error('Chess board squares e2 or e4 not found in React tree');
        sqE2.click();
        await new Promise((r) => setTimeout(r, 200));
        sqE4.click();

        // Wait for Native Web Worker to calculate and apply Black's response (Turn 3, activePlayer P1)
        const reactWaitStart = Date.now();
        while (Date.now() - reactWaitStart < 12000) {
          const dom = gameStore.getState().domain;
          if (dom.turnNumber >= 3 && dom.activePlayer === 'P1') {
            break;
          }
          await new Promise((r) => setTimeout(r, 100));
        }

        const domainAfterBot = gameStore.getState().domain;
        if (domainAfterBot.turnNumber < 3 || domainAfterBot.activePlayer !== 'P1') {
          throw new Error(`React native bot response timed out: turn=${domainAfterBot.turnNumber}, player=${domainAfterBot.activePlayer}`);
        }

        // Test Undo: 2-ply round rollback
        const undoBtn = document.getElementById('bot-undo-button');
        if (!undoBtn) throw new Error('bot-undo-button not found');
        undoBtn.click();
        await new Promise((r) => setTimeout(r, 200));

        const domainAfterUndo = gameStore.getState().domain;
        if (domainAfterUndo.turnNumber !== 1 || domainAfterUndo.activePlayer !== 'P1') {
          throw new Error(`Undo did not roll back full 2-ply round in browser: turn=${domainAfterUndo.turnNumber}`);
        }

        // Test Redo: 2-ply round restoration
        const redoBtn = document.getElementById('bot-redo-button');
        if (!redoBtn) throw new Error('bot-redo-button not found');
        redoBtn.click();
        await new Promise((r) => setTimeout(r, 200));

        const domainAfterRedo = gameStore.getState().domain;
        if (domainAfterRedo.turnNumber !== 3 || domainAfterRedo.activePlayer !== 'P1') {
          throw new Error(`Redo did not restore full 2-ply round in browser: turn=${domainAfterRedo.turnNumber}`);
        }

        // Test Reset: reset match
        const resetBtn = document.getElementById('bot-reset-button');
        if (!resetBtn) throw new Error('bot-reset-button not found');
        resetBtn.click();
        await new Promise((r) => setTimeout(r, 200));

        const domainAfterReset = gameStore.getState().domain;
        if (domainAfterReset.turnNumber !== 1 || domainAfterReset.activePlayer !== 'P1') {
          throw new Error(`Reset button did not restore initial match in browser: turn=${domainAfterReset.turnNumber}`);
        }

        reactRoot.unmount();

        resultEl.textContent = 'SUCCESS: ' + JSON.stringify({
          handshake: pong,
          entityCount: meta.entityCount,
          cellCount,
          pathFound: pathResult.found,
          pathLength: pathResult.path.length,
          voronoiVerified: true,
          aiVerified: true,
          aiBestMove: aiResult.bestMove,
          reactIntegrationVerified: true,
        });
      } catch (err) {
        resultEl.textContent = 'ERROR: ' + (err instanceof Error ? err.message : String(err));
      } finally {
        try {
          fetch('/__smoke_result', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: resultEl.textContent,
          });
        } catch {}
      }
    }

    runTest();
  </script>
</body>
</html>
