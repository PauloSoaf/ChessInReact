<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chromium Web Worker Smoke Test</title>
</head>
<body>
  <div id="result">RUNNING</div>
  <script type="module">
    import { EngineBridge } from './src/core/workers/EngineBridge.ts';
    import { createDefaultDomainState } from './src/core/state/initialState.ts';
    import { asCoordinateKey, asEntityId } from './src/core/coordinates/index.ts';

    async function runTest() {
      const resultEl = document.getElementById('result');
      try {
        // Instantiate EngineBridge with native browser Worker (no workerPort override!)
        const bridge = new EngineBridge({ timeoutMs: 5000 });

        // 1. Protocol PING / PONG handshake
        const pong = await bridge.ping();
        if (pong !== 'PONG') throw new Error(`PING failed: got ${pong}`);

        // 2. Transfer ArrayBuffer & state metadata
        const domain = createDefaultDomainState('browser-worker-smoke');
        domain.boardEntities[asEntityId('p1')] = {
          id: asEntityId('p1'),
          type: 'PIECE',
          ownerId: 'P1',
          variantId: 'PAWN',
          position: asCoordinateKey('4,1'),
          hasMoved: false,
          isCaptured: false,
        };
        const meta = await bridge.echoStateMetadata(domain);
        if (meta.schemaVersion !== 1 || meta.entityCount !== 1) {
          throw new Error(`Metadata mismatch: ${JSON.stringify(meta)}`);
        }

        // 3. Transfer & deserialize entities
        const echoed = await bridge.echoDeserializedEntities(domain);
        if (echoed.entities.length !== 1 || echoed.entities[0].id !== 'p1') {
          throw new Error(`Entity echo mismatch: ${JSON.stringify(echoed)}`);
        }

        // 4. Real procedural generation request (chunk 16x16 with 256 cells)
        const chunks = await bridge.generateChunks({
          topologyType: 'SQUARE',
          seed: 'browser-smoke-seed',
          chunkCoords: [{ chunkX: 0, chunkY: 0 }],
          chunkSize: 16,
        });
        if (!chunks || chunks.length !== 1) {
          throw new Error(`GENERATE_CHUNKS failed: expected 1 chunk, got ${chunks?.length}`);
        }
        const cellCount = Object.keys(chunks[0].cells).length;
        if (cellCount !== 256) {
          throw new Error(`GENERATE_CHUNKS cell count mismatch: expected 256, got ${cellCount}`);
        }

        // 5. Real A* pathfinding computation in worker thread
        const pathResult = await bridge.computePath({
          topologyType: 'SQUARE',
          start: asCoordinateKey('0,0'),
          goal: asCoordinateKey('3,3'),
          obstacleCoords: [asCoordinateKey('1,1'), asCoordinateKey('2,2')],
        });
        if (!pathResult.found || pathResult.path.length === 0) {
          throw new Error(`COMPUTE_PATHFINDING failed to find path around obstacles`);
        }

        // 6. Voronoi irregular chunk generation & pathfinding in worker thread (PATCH-13)
        const voronoiChunks = await bridge.generateChunks({
          topologyType: 'VORONOI_IRREGULAR',
          seed: 'voronoi-worker-smoke-seed',
          chunkCoords: [{ chunkX: 0, chunkY: 0 }],
          chunkSize: 16,
          topologyOptions: { boundingRadius: 32 },
        });
        if (!voronoiChunks || voronoiChunks.length !== 1) {
          throw new Error(`VORONOI GENERATE_CHUNKS failed: expected 1 chunk`);
        }
        const voronoiCell = voronoiChunks[0].cells['0,0'];
        if (!voronoiCell || voronoiCell.topology !== 'VORONOI_IRREGULAR') {
          throw new Error(`VORONOI GENERATE_CHUNKS cell topology mismatch: expected VORONOI_IRREGULAR, got ${voronoiCell?.topology}`);
        }

        const voronoiSeed = 'voronoi-worker-smoke-seed';
        const voronoiPath = await bridge.computePath({
          topologyType: 'VORONOI_IRREGULAR',
          seed: voronoiSeed,
          start: asCoordinateKey('0,0'),
          goal: asCoordinateKey('1,1'),
          topologyOptions: { boundingRadius: 32 },
        });
        if (!voronoiPath.found) {
          throw new Error(`VORONOI COMPUTE_PATHFINDING failed to find path in Voronoi topology`);
        }

        // Seed contract: Voronoi pathfinding without an explicit seed must be rejected (no default-seed fallback)
        let seedlessRejected = false;
        try {
          await bridge.computePath({
            topologyType: 'VORONOI_IRREGULAR',
            start: asCoordinateKey('0,0'),
            goal: asCoordinateKey('1,1'),
            topologyOptions: { boundingRadius: 32 },
          });
        } catch (e) {
          seedlessRejected = /explicit seed/i.test(String(e && e.message));
        }
        if (!seedlessRejected) {
          throw new Error('VORONOI COMPUTE_PATHFINDING without explicit seed was not rejected');
        }

        // 7. Clean worker termination
        bridge.dispose();

        resultEl.textContent = 'SUCCESS: ' + JSON.stringify({
          handshake: pong,
          entityCount: meta.entityCount,
          cellCount,
          pathFound: pathResult.found,
          pathLength: pathResult.path.length,
          voronoiVerified: true,
        });
      } catch (err) {
        resultEl.textContent = 'ERROR: ' + (err instanceof Error ? err.message : String(err));
      } finally {
        try {
          fetch('/__smoke_result', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: resultEl.textContent,
          });
        } catch {}
      }
    }

    runTest();
  </script>
</body>
</html>
