<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="knightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4C0" />
      <stop offset="50%" stop-color="#C4A77D" />
      <stop offset="100%" stop-color="#8F714B" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#090D11" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#shieldGradient)" stroke="#C4A77D" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Staunton Knight Sculptural Profile -->
  <g filter="url(#subtleGlow)">
    <!-- Base Pedestal -->
    <path d="M14 52 L50 52 C50 49 46 48 44 48 L20 48 C18 48 14 49 14 52 Z" fill="url(#knightGradient)" />
    <path d="M18 47 L46 47 L43 44 L21 44 Z" fill="url(#knightGradient)" opacity="0.9" />
    <!-- Chest, Mane and Neck Curve -->
    <path d="M21 44 C20 38 18 32 23 26 C25 24 28 23 30 25 C31 22 34 18 36 14 C36 12 34 10 33 11 C38 11 43 14 44 19 C45 22 43 25 45 29 C47 33 46 38 43 44 Z" fill="url(#knightGradient)" />
    <!-- Snout & Jaw -->
    <path d="M30 25 C26 26 21 28 17 31 C15 32 15 35 18 35 C22 35 25 33 28 32 C27 36 29 40 33 42 C34 40 34 38 33 36 C34 35 37 34 37 32 C35 31 32 30 31 28 Z" fill="url(#knightGradient)" />
    <!-- Eye & Ears -->
    <circle cx="28" cy="22" r="1.5" fill="#090D11" />
    <!-- Mane Grooves -->
    <path d="M39 16 C38 20 37 24 41 28" stroke="#090D11" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M42 22 C41 26 40 30 43 35" stroke="#090D11" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
</svg>
