name: Multiplatform Determinism Matrix (x86_64 & ARM64) - RNF-07

on:
  push:
    branches:
      - feat/procedural-boards-topology
      - 'feat/**'
      - main
      - develop
  pull_request:
    branches:
      - feat/procedural-boards-topology
      - 'feat/**'
      - main
      - develop

jobs:
  verify-cross-platform-determinism:
    name: Determinism (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ChessInReact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ChessInReact/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Numeric Determinism Hash Matrix (RNF-07)
        run: node scripts/verifyDeterminism.js
